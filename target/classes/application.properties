# Campus Connect 2030 - Spring Boot Configuration
server.port=8080

# Application Identity
spring.application.name=Campus Connect 2030

# Database Configuration (MySQL production ready with H2 MySQL-compatibility mode fallback)
# To connect to your local MySQL instance, set environment variables:
# DB_URL=jdbc:mysql://localhost:3306/campus_connect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# DB_USER=your_mysql_username
# DB_PASSWORD=your_mysql_password
# DB_DRIVER=com.mysql.cj.jdbc.Driver

spring.datasource.url=${DB_URL:jdbc:h2:mem:campusconnect;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Persistence
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (available during development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & Sessions
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true

# Static resource caching (instant updates in dev)
spring.web.resources.chain.cache=false
